<!-- J1 parity gate, browser side: run the SAME parity_clip.webm through
     browser MediaPipe FaceLandmarker + features.js and compare every frame
     against ml/tests/fixtures/parity_expected.json (Python reference).
     Driven by ml/scripts/browser_tests.py; results in window.__RESULT. -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>parity</title></head>
<body>
<video id="v" muted playsinline preload="auto"></video>
<script type="module">
  import { FilesetResolver, FaceLandmarker }
    from "/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs";
  import { computeFeatures, landmarksToPixels, FEATURE_NAMES }
    from "/src/features.js";

  const RESULT = { ok: false, error: null, harnessVersion: 3 };
  window.__RESULT = null;

  try {
    const expected = await (await fetch("/harness/parity_expected.json")).json();

    const vision = await FilesetResolver.forVisionTasks(
      "/node_modules/@mediapipe/tasks-vision/wasm");
    const landmarker = await FaceLandmarker.createFromOptions(vision, {
      // CPU delegate = XNNPACK, the same backend the Python extraction
      // used. The GPU delegate shifts landmarks by ~1-2 px, which blows
      // EAR/gaze past tolerance (see docs/results/parity_report.json
      // history). The app must use CPU too, or re-extract with GPU.
      baseOptions: { modelAssetPath: "/harness/face_landmarker.task",
                     delegate: "CPU" },
      runningMode: "VIDEO",
      numFaces: 1,
    });

    const video = document.getElementById("v");
    // Fetch as a blob: SimpleHTTPRequestHandler has no Range support, and
    // Chromium refuses to seek un-rangeable media (currentTime silently
    // stays 0 while 'seeked' still fires). A blob URL is fully local and
    // always seekable.
    const blob = await (await fetch("/harness/parity_clip.webm")).blob();
    video.src = URL.createObjectURL(blob);
    await new Promise((resolve, reject) => {
      video.onloadeddata = resolve;
      video.onerror = () => reject(new Error(
        "video decode failed (codec support?): " +
        (video.error ? video.error.message : "unknown")));
    });
    RESULT.videoSize = [video.videoWidth, video.videoHeight];

    const seekTo = (t) => new Promise((resolve) => {
      video.onseeked = resolve;
      video.currentTime = t;
    });

    // Passing the <video> element straight to detectForVideo yields STALE
    // frames after seeking (verified: browser feature series was near-
    // constant while Python's varied). Draw each seeked frame to a canvas
    // and detect on that instead.
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    const srcFps = expected.video.fps;      // 30
    const step = expected.video.sample_step; // 3
    const n = expected.num_frames;           // 100
    const frameShape = [video.videoHeight, video.videoWidth];

    const actual = [];
    const frameChecksums = [];
    const seekTimes = [];
    for (let k = 0; k < n; k++) {
      // sample the SAME source frames as Python: 0, 3, 6, ... (frame centre)
      await seekTo((k * step + 0.5) / srcFps);
      await new Promise((r) => requestAnimationFrame(r));
      ctx.drawImage(video, 0, 0);
      { // frame-advance diagnostic: full checksum of the canvas pixels
        const d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let s = 0;
        for (let i = 0; i < d.length; i += 4) s += d[i];  // all red bytes
        frameChecksums.push(s);
        seekTimes.push(video.currentTime);
      }
      const res = landmarker.detectForVideo(canvas, k * 100);
      let feats;
      if (res.faceLandmarks && res.faceLandmarks.length > 0) {
        const px = landmarksToPixels(res.faceLandmarks[0],
                                     video.videoWidth, video.videoHeight);
        feats = computeFeatures(px, frameShape, 0.0);
      } else {
        feats = computeFeatures(null, frameShape, 0.0);
      }
      actual.push(Array.from(feats));
    }

    // ---- compare -----------------------------------------------------
    const nf = FEATURE_NAMES.length;
    const FACE = nf - 1;
    let faceMismatch = 0;
    const maxAbs = new Array(nf).fill(0);
    const sumAbs = new Array(nf).fill(0);
    let compared = 0;
    for (let k = 0; k < n; k++) {
      const e = expected.features[k];
      const a = actual[k];
      if (e[FACE] !== a[FACE]) { faceMismatch += 1; continue; }
      if (e[FACE] === 0) continue;
      compared += 1;
      for (let f = 0; f < nf; f++) {
        const d = Math.abs(e[f] - a[f]);
        if (d > maxAbs[f]) maxAbs[f] = d;
        sumAbs[f] += d;
      }
    }
    const TOL = 0.02;
    RESULT.framesCompared = compared;
    RESULT.faceMismatchFrames = faceMismatch;
    RESULT.perFeatureMaxAbsDiff = Object.fromEntries(
      FEATURE_NAMES.map((name, f) => [name, maxAbs[f]]));
    RESULT.perFeatureMeanAbsDiff = Object.fromEntries(
      FEATURE_NAMES.map((name, f) => [name, sumAbs[f] / Math.max(compared, 1)]));
    RESULT.worstFeatureDiff = Math.max(...maxAbs);
    RESULT.tolerance = TOL;
    RESULT.actual = actual;  // full series for offline diagnosis
    RESULT.distinctFrames = new Set(frameChecksums).size;
    RESULT.frameChecksums = frameChecksums.slice(0, 10);
    RESULT.seekTimes = seekTimes.slice(0, 10);
    RESULT.ok = compared >= n * 0.95
      && faceMismatch <= Math.ceil(n * 0.02)
      && RESULT.worstFeatureDiff < TOL;
  } catch (e) {
    RESULT.error = String(e && e.stack ? e.stack : e);
  }
  window.__RESULT = RESULT;
</script>
</body>
</html>
